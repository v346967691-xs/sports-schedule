name: 定时探针（临时诊断用）

# 临时诊断：确认这个仓库的「定时触发」到底能不能跑。
# 如果它每 5 分钟出现一条 schedule 记录，说明定时机制正常，问题在别处；
# 如果它一条都不出现，说明该仓库的 schedule 触发整体没生效。
# 诊断结束后会删除本文件。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 打个时间戳
        run: date -u +"探针触发于 %Y-%m-%dT%H:%M:%SZ"
