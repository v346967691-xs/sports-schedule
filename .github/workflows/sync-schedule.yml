name: 赛程快照刷新（每小时）

# 触发方式：定时 cron（每小时第 23 分钟，UTC）+ 仓库 Actions 页手动 workflow_dispatch。
# 这条工作流是「关电脑也能刷新比分」的关键：
# 它跑在 GitHub 的服务器上，不依赖本机开机，也不依赖 WorkBuddy 是否运行。
# 云 SDK 用的是公开 publishableKey（anon 身份），schedule_cache 的写入又被 RLS 锁死在
# id='latest' 这一行，所以这里不需要配置任何 Secret。

on:
  schedule:
    # 每小时第 23 分钟。GitHub Actions 的 cron 是 UTC 时间。
    #
    # 为什么改成每小时，而不是继续用 */15：
    #   实测（2026-09-27 18:58Z ~ 2026-09-28 05:42Z）*/15 的实际投递间隔是
    #   3 小时 → 2 小时 27 分 → 5 小时 16 分，**远达不到 15 分钟，而且间隔还在拉长**。
    #   官方与社区的一致结论：schedule 是「尽力而为」的共享队列，
    #   **频率越高的任务越容易被推迟甚至丢弃**，且整点前后是最拥堵的时段。
    #   所以这里反向操作 —— 降频 + 避开整点（选第 23 分），换取更高的实际到达率：
    #   与其申请 96 次/天却只到 4~8 次，不如申请 24 次/天、争取每次都到。
    #
    # 想要真正的 15 分钟：只能靠外部定时打 workflow_dispatch（见项目 MEMORY），
    #   GitHub 自己的 cron 给不了这个精度。
    - cron: '23 * * * *'
  workflow_dispatch: # 允许在 GitHub 仓库页面手动点「Run workflow」立即同步一次

# 同一时刻只跑一个，避免上一次还没跑完又叠一次
concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装云 SDK
        run: npm install

      - name: 刷新并推送赛程快照到云端
        run: node tools/cloud-sync.js

      - name: 校验云端快照是否真的新鲜
        run: node tools/check-cloud.js

# 每周心跳另开一个工作流（见 .github/workflows/keepalive.yml），
# 避免它跟着这里每 15 分钟白跑一次检出。
