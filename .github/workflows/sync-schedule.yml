name: 赛程快照刷新（每 15 分钟）

# 触发方式：定时 cron（每小时第 23 分钟，UTC）+ 仓库 Actions 页手动 workflow_dispatch。
# 这条工作流是「关电脑也能刷新比分」的关键：
# 它跑在 GitHub 的服务器上，不依赖本机开机，也不依赖 WorkBuddy 是否运行。
# 云 SDK 用的是公开 publishableKey（anon 身份），schedule_cache 的写入又被 RLS 锁死在
# id='latest' 这一行，所以这里不需要配置任何 Secret。

on:
  schedule:
    # 每 15 分钟一次（UTC）。GitHub Actions 的 cron 最短支持 5 分钟。
    #
    # 这里试过降频，实测无效，故改回 */15，过程记录如下（别再重复试）：
    #   2026-09-28 15:31 曾按「高频任务更容易被共享队列丢弃」的官方/社区建议，
    #   把频率降到每小时第 23 分（避开整点）。结果：改完之后 16:23 / 17:23 / 18:23 / 19:23
    #   **连续四班一次都没投递**，4.4 小时内 0 次运行，云端数据一度陈旧 262 分钟。
    #   而降频前的 */15 在 11 小时内至少投递了 4 次（间隔 3h / 2h27m / 5h16m）。
    #   → 结论：这个仓库上改频率改变不了什么，*/15 是唯一观测到有投递的配置，先保持。
    #
    # 但 */15 的真实粒度也只有约 2.5~5 小时，远达不到 15 分钟。
    # 想要真正可靠的刷新，只能靠外部定时打 workflow_dispatch（见项目 MEMORY），
    # GitHub 自己的 cron 给不了这个精度。
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许在 GitHub 仓库页面手动点「Run workflow」立即同步一次

# 同一时刻只跑一个，避免上一次还没跑完又叠一次
concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装云 SDK
        run: npm install

      - name: 刷新并推送赛程快照到云端
        run: node tools/cloud-sync.js

      - name: 校验云端快照是否真的新鲜
        run: node tools/check-cloud.js

      # 生成日报并推送到 daily_brief。为什么每次同步都跑，而不是卡出报时刻：
      #   ① 幂等 —— 每次都重算最近 2 天的全部期次，跑几次结果都一样；
      #   ② GitHub 原生 cron 在这个仓库实测会延迟 2~3 小时，卡精确时刻反而会漏班；
      #      而跟着 sync 走，任何一次同步成功都会顺带把日报刷新一遍，最可靠；
      #   ③ 耗时不到 1 秒，公开仓库 Actions 分钟数免费。
      # continue-on-error：日报是附加功能，它的成败不该污染「赛程同步」本身的红绿信号，
      # 后者才是用户看比分的主链路（失败会被 check-cloud 之前的步骤捕获）。
      - name: 生成日报并推送到云端
        continue-on-error: true
        run: node tools/brief-push.js

# 每周心跳另开一个工作流（见 .github/workflows/keepalive.yml），
# 避免它跟着这里每 15 分钟白跑一次检出。
