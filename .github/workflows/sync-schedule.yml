name: 赛程快照每小时刷新

# 触发方式：定时 cron（每小时第 12 分钟，UTC）+ 仓库 Actions 页手动 workflow_dispatch。
# 这条工作流是「关电脑也能刷新比分」的关键：
# 它跑在 GitHub 的服务器上，不依赖本机开机，也不依赖 WorkBuddy 是否运行。
# 云 SDK 用的是公开 publishableKey（anon 身份），schedule_cache 的写入又被 RLS 锁死在
# id='latest' 这一行，所以这里不需要配置任何 Secret。

on:
  schedule:
    # 每 15 分钟跑一次。GitHub Actions 的 cron 是 UTC 时间，最短支持 5 分钟。
    #
    # 为什么是 15 分钟而不是 5 分钟：
    #   1) GitHub 的定时调度不保证准点，高峰期常延迟数分钟甚至更久；
    #      间隔压到 5 分钟，实际可能变成两三次挤在一起，收益反而不明显。
    #   2) 单次同步要抓 14 个赛事（足球按月份分片），约几十个请求、耗时约 50 秒，
    #      太频繁会白白消耗额度，也有惹恼数据源的风险。
    #   3) 15 分钟已足够覆盖「比赛进行中的实时比分」，最坏延迟约 20 分钟。
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许在 GitHub 仓库页面手动点「Run workflow」立即同步一次

# 同一时刻只跑一个，避免上一次还没跑完又叠一次
concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装云 SDK
        run: npm install

      - name: 刷新并推送赛程快照到云端
        run: node tools/cloud-sync.js

      - name: 校验云端快照是否真的新鲜
        run: node tools/check-cloud.js

# 每周心跳另开一个工作流（见 .github/workflows/keepalive.yml），
# 避免它跟着这里每 15 分钟白跑一次检出。
