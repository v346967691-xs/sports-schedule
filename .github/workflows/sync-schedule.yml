name: 赛程刷新与实时比分（每 15 分钟触发，内部节流）

# 触发方式：GitHub 定时 cron + 外部 cron-job.org 每 15 分钟 POST workflow_dispatch（带 PAT）。
# 这条工作流是「关电脑也能刷新比分」的关键：
# 它跑在 GitHub 的服务器上，不依赖本机开机，也不依赖 WorkBuddy 是否运行。
# 云 SDK 用的是公开 publishableKey（anon 身份），schedule_cache 的写入又被 RLS 锁死在
# id='latest' 这一行，所以这里不需要配置任何 Secret。
#
# 🔴🔴 2026-10-05 事故后的架构调整 —— **触发频率 ≠ 写入频率**
#   事故：每 15 分钟被触发 = 96 次/天，而每班都无条件全量 upsert ≈1.3MB
#         → 3.7GB/月落库，免费版 5000 资源点 5 天烧穿，数据库随即被隔离。
#   修法：**保持高频触发（实时比分需要），但把「大快照」和「实时比分」两条路径解耦**
#      · 大快照 schedule/standings/scorers/detail ≈0.8MB → 由 cloud-sync.js 内部的
#        **节流闸**控制，默认 90 分钟才真正写一次（96 次/天 → 16 次/天）
#      · 实时比分 live_scores ≈2KB → 完全不过闸，始终是 60 秒粒度
#   ✅ 这样做的好处：**cron-job.org 那边一个字都不用改**，照旧每 15 分钟打一次即可。
#   ⚠️ 想把全量刷新调得更频繁/更懒，改 SYNC_MIN_INTERVAL_MIN（单位分钟，0 = 关闸）。

on:
  schedule:
    # 每 15 分钟一次（UTC）。GitHub Actions 的 cron 最短支持 5 分钟。
    #
    # 这里试过降频，实测无效，故改回 */15，过程记录如下（别再重复试）：
    #   2026-09-28 15:31 曾按「高频任务更容易被共享队列丢弃」的官方/社区建议，
    #   把频率降到每小时第 23 分（避开整点）。结果：改完之后 16:23 / 17:23 / 18:23 / 19:23
    #   **连续四班一次都没投递**，4.4 小时内 0 次运行，云端数据一度陈旧 262 分钟。
    #   而降频前的 */15 在 11 小时内至少投递了 4 次（间隔 3h / 2h27m / 5h16m）。
    #   → 结论：这个仓库上改频率改变不了什么，*/15 是唯一观测到有投递的配置，先保持。
    #
    # 但 */15 的真实粒度也只有约 2.5~5 小时，远达不到 15 分钟。
    # 想要真正可靠的刷新，只能靠外部定时打 workflow_dispatch（见项目 MEMORY），
    # GitHub 自己的 cron 给不了这个精度。
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: '忽略闲时判断，强制执行本班云端任务'
        type: boolean
        default: false

# 同一时刻只跑一个，避免上一次还没跑完又叠一次
concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # ⚠️ 留出实时比分盯场（最长 14 分钟）、前序同步和最终云端新鲜度校验的余量。
    timeout-minutes: 20
    env:
      CLOUD_USAGE_DIR: '${{ github.workspace }}/.cloud-diagnostics/usage'
      NOTIFICATION_EMPTY_CACHE: '${{ github.workspace }}/.cloud-diagnostics/notification-empty'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装云 SDK
        run: npm install

      # GitHub cache contains only public match metadata; restoring it never touches WB.
      - name: 恢复上一班公共活动记录
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .workbuddy/activity-plan.json
          key: activity-plan-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: activity-plan-v1-${{ github.sha }}-

      - name: 验证数据链路回归
        run: npm run test:data

      - name: 验证 S 赛双时段日报与保存规则
        run: node --test tools/worlds-brief.test.js tools/worlds-brief-db.test.js

      - name: 验证网球积分与参赛判断
        run: node --test tools/tennis-insights.test.js tools/tennis-participation.test.js tools/tennis-live-result.test.js tools/tennis-seed-rank-source.test.js

      - name: 判断是否可以整班免云端访问
        id: activity
        continue-on-error: true
        env:
          ACTIVITY_FORCE: ${{ inputs.force_refresh == true || vars.SYNC_IDLE_SKIP_ENABLED == 'false' }}
        run: node tools/activity-gate.js

      - name: 云环境可用性入口检查
        id: cloudhealth
        # Missing/failed gate output fails open: only an explicit false skips the cloud.
        if: steps.activity.outputs.run != 'false'
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/cloud-health.js

      - name: 刷新网球实时积分与官方参赛资料
        id: insights
        if: steps.cloudhealth.outputs.available == 'true'
        continue-on-error: true
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/tennis-insights.js

      - name: 验证 ATP/WTA 单场统计
        run: node --test tools/tennis-stats.test.js tools/live-tennis-stats.test.js tools/match-status.test.js tools/tennis-levels.test.js

      - name: 刷新 ATP/WTA 单场统计（官方优先、缺项补齐）
        id: tennisstats
        if: steps.cloudhealth.outputs.available == 'true'
        continue-on-error: true
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/tennis-stats.js

      - name: 刷新并推送赛程快照到云端
        if: steps.cloudhealth.outputs.available == 'true'
        id: sync
        # 🔴 内部自带节流闸（默认 90 分钟一次）：被触发不等于会写，见文件头注释。
        #    跳过走退出码 0（正常路径），并把 pushed=false 写给后面的 step 判断。
        env:
          SYNC_MIN_INTERVAL_MIN: '90'
          # match_detail 的**日桶批量推送**节流（分钟）。
          # 🔴 2026-10-11 显式设成 180：这个变量以前**从来没在 workflow 里设过**，
          #    一直吃 tools/cloud-sync.js:148 的默认 90 —— 那是 2026-10-07（`55b7799`）
          #    用户拍板从 180 降下来的，代价当时算的是「落库 +74MB/月，约占额度 2%」。
          #    10-11 复测发现额度余量已从 20% 收到 7%（最坏档 93%），量级变了 → 改回 180。
          #    收益：写请求 -80/天（-10%）、字节 -3.5MB/天（-11%）。
          # ⚠️ 为什么「用户感知代价 ≈ 0」——本闸**只管主闸放行那一班的 14 个日桶批量推**，
          #    不碰 detailFastLane（空壳补抓快通道）。刚完赛的比赛仍由快通道在
          #    下一个**被跳过**的班次（≤15 分钟）补齐，与 90 时完全一样。
          #    真正被拉长的只有历史日桶的批量校正频率。
          # ⚠️ 改这个值前先读 tools/cloud-sync.js 里 DETAIL_MIN_INTERVAL_MIN 上方的注释。
          SYNC_DETAIL_INTERVAL_MIN: '180'
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/cloud-sync.js

      - name: 校验云端快照是否真的新鲜
        id: snapshothealth
        continue-on-error: true
        if: steps.cloudhealth.outputs.available == 'true'
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/check-cloud.js

      # 生成日报并推送到 daily_brief。为什么每次同步都跑，而不是卡出报时刻：
      #   ① 幂等 —— 每次都重算最近 2 天的全部期次，跑几次结果都一样；
      #   ② GitHub 原生 cron 在这个仓库实测会延迟 2~3 小时，卡精确时刻反而会漏班；
      #      而跟着 sync 走，任何一次同步成功都会顺带把日报刷新一遍，最可靠；
      #   ③ 耗时不到 1 秒，公开仓库 Actions 分钟数免费。
      # continue-on-error：日报是附加功能，它的成败不该污染「赛程同步」本身的红绿信号，
      # 后者才是用户看比分的主链路（失败会被 check-cloud 之前的步骤捕获）。
      # 🟡 2026-10-05 追加：不再每 15 分钟跑，只在两种情况下跑。
      #    日报就两个出报时刻（06/21），内容几乎不变，却原本每 15 分钟把同样 4 行重写一遍
      #    （≈46MB/月纯浪费）。
      #
      # 🔴 但**不能只挂在 sync 的 pushed 上** —— 节流闸把大快照拉到 90 分钟一次，
      #    推送时刻会随时间漂移，早报可能迟到 07:45、晚报迟到 22:45（10-05 我自己引入的回归）。
      #    → 两个条件取「或」：
      #      ① sync 真的推了（16 次/天，散布全天，兜底）
      #      ② 当前北京时间落在出报窗口内（06~07 点 / 21~22 点，各 4 班）
      #    这样 06:00 与 21:00 的期次一定在 15 分钟内落库，其余时间不再空转。
      - name: 判断是否处于出报窗口
        id: briefwin
        if: always()
        run: |
          H=$(TZ=Asia/Shanghai date +%H)
          case "$H" in
            06|07|21|22) echo "due=1" >> "$GITHUB_OUTPUT" ;;
            *)           echo "due=0" >> "$GITHUB_OUTPUT" ;;
          esac
          # S赛：09/14 点分别出报，下一小时作为队列延迟和失败重试窗口。
          case "$H" in
            09|10|14|15) echo "worlds_due=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "worlds_due=0" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 生成日报并推送到云端
        id: briefpublish
        continue-on-error: true
        if: steps.cloudhealth.outputs.available == 'true' && (steps.sync.outputs.pushed == 'true' || steps.briefwin.outputs.due == '1')
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/brief-push.js

      - name: 生成 S 赛晨报（09 点首发、14 点更新，失败自动重试）
        id: worldsbrief
        continue-on-error: true
        if: always() && steps.cloudhealth.outputs.available == 'true' && (steps.sync.outputs.pushed == 'true' || steps.briefwin.outputs.worlds_due == '1')
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/worlds-brief-push.js

      # 订阅提醒只发送用户已同意的消息。失败留到盯场之后统一报红，保证比分刷新仍执行。
      - name: 发送全赛事赛前与赛果订阅通知
        if: steps.cloudhealth.outputs.available == 'true'
        id: notifications
        continue-on-error: true
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_MINIPROGRAM_STATE: ${{ vars.WECHAT_MINIPROGRAM_STATE || 'formal' }}
        run: |
          if [ -n "$NOTIFY_TOKEN" ]; then echo "::add-mask::$NOTIFY_TOKEN"; fi
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/match-notification-push.js

      # 实时比分盯场：**挂在这一次的运行里循环**，每 60 秒刷一次 live_scores（约 2KB）。
      #
      # 🔴 为什么这样做，而不是「再建一个每 2 分钟的高频定时任务」：
      #    ① 本仓库的 GitHub 原生 cron 实测 2.5~5 小时才投递一次（改频率无效），
      #       可靠触发只能靠外部 cron-job.org POST —— 每多加一条就要多配一次外部服务；
      #    ② 挂在这里则**零外部配置**：一次运行约 2 分钟（主同步）+ 14 分钟（盯场），
      #       几乎连续覆盖，等效粒度就是 60 秒；
      #    ③ `schedule_cache` 一行原本 891KB，2 分钟刷一次 = 790MB/天 —— 只有把它拆成
      #       只含进行中比赛的小表（~2KB）才刷得起。
      #
      # ✅ 2026-10-05：**这一步就是「高频路径」的全部**，它不受上面节流闸影响。
      #    90 分钟才写一次的是那份大快照，2KB 的实时比分仍然 60 秒一次 —— 用户感知到的
      #    实时性没有任何退化，省下的却是落库量的大头。
      # ⚠️ 没有进行中的比赛时脚本会自己提前退出（连续 3 轮为空），凌晨不白占 Actions。
      # 来源失败或云端写入失败必须让本班失败，不能把失效的实时比分报成成功。
      - name: 盯进行中的比赛（实时比分）
        id: livewatch
        if: steps.cloudhealth.outputs.available == 'true'
        # 复用每分钟盯场循环检查赛前/赛果通知，避免只在每班开始时发送一次。
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_MINIPROGRAM_STATE: ${{ vars.WECHAT_MINIPROGRAM_STATE || 'formal' }}
        run: |
          if [ -n "$NOTIFY_TOKEN" ]; then echo "::add-mask::$NOTIFY_TOKEN"; fi
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/live-watch.js --minutes=14 --every=60 --notify

      # 即使盯场因某个联赛源失败而报红，也检查云端是否已有新鲜且完整的实时心跳。
      - name: 校验实时比分新鲜度
        id: livehealth
        if: always() && steps.cloudhealth.outputs.available == 'true'
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/check-cloud.js --live

      - name: 检查订阅通知执行结果
        if: always() && steps.notifications.outcome == 'failure'
        run: |
          echo '::error::订阅通知未完成，请查看通知步骤日志（比分盯场仍已执行）'
          exit 1

      - name: 检查 S 赛日报执行结果
        if: always() && steps.worldsbrief.outcome == 'failure'
        run: |
          echo '::error::S 赛日报未成功保存，请查看日报步骤日志（比分刷新仍已执行）'
          exit 1


      - name: 统一报告云环境与快照故障
        if: always() && steps.activity.outputs.run != 'false' && (steps.cloudhealth.outputs.available != 'true' || steps.snapshothealth.outcome == 'failure')
        run: |
          echo '::error::云环境不可用或快照陈旧，请检查入口检查与快照校验日志；本班不能标为健康。'
          exit 1

      - name: 保存本班公共活动记录
        if: always() && steps.activity.outputs.run != 'false'
        continue-on-error: true
        env:
          ACTIVITY_HEALTHY: ${{ job.status == 'success' && steps.cloudhealth.outputs.available == 'true' && steps.snapshothealth.outcome == 'success' && steps.livehealth.outcome == 'success' && steps.livewatch.outcome == 'success' && steps.insights.outcome == 'success' && steps.tennisstats.outcome == 'success' && steps.sync.outcome == 'success' && steps.notifications.outcome == 'success' && steps.worldsbrief.outcome != 'failure' && steps.briefpublish.outcome != 'failure' }}
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/activity-gate.js --record

      - name: 缓存下一班判断依据
        if: always() && steps.activity.outputs.run != 'false'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .workbuddy/activity-plan.json
          key: activity-plan-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 汇总云请求诊断
        if: always()
        run: NODE_OPTIONS="--require=$GITHUB_WORKSPACE/tools/cloud-usage.js" node tools/cloud-usage-summary.js

      - name: 保存本班云请求诊断（供七日对账）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.cloud-diagnostics/usage
          retention-days: 14
          if-no-files-found: ignore
